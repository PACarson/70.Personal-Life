<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Life OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #14161a;
      --surface: #1d2025;
      --surface-hover: #262a31;
      --ink: #e8e6e1;
      --ink-dim: #8b877f;
      --ink-faint: #55524c;
      --accent: #c99a5b;
      --accent-dim: #8a6d42;
      --line: #2a2d33;
      --danger: #c4685c;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --sans: 'IBM Plex Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      display: flex;
      min-height: 100vh;
    }

    /* ---------- Nav ---------- */
    .nav {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
    }

    .nav-brand {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--ink-dim);
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .nav-brand strong { color: var(--ink); font-weight: 600; }

    .nav-item {
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 20px;
      color: var(--ink-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: default;
    }
    .nav-item.active {
      color: var(--accent);
      background: rgba(201, 154, 91, 0.08);
      border-right: 2px solid var(--accent);
      cursor: pointer;
    }
    .nav-soon {
      font-size: 10px;
      color: var(--ink-faint);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 1px 5px;
      letter-spacing: 0.03em;
    }

    /* ---------- Workspace ---------- */
    .workspace {
      flex: 1;
      padding: 40px 48px;
      max-width: 640px;
    }

    .workspace h1 {
      font-family: var(--sans);
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 6px;
    }
    .workspace .sub {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-dim);
      margin: 0 0 28px;
    }

    /* ---------- Composer ---------- */
    .composer {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 28px;
    }
    .composer textarea {
      width: 100%;
      resize: none;
      background: transparent;
      border: none;
      outline: none;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 44px;
      padding: 0;
    }
    .composer textarea::placeholder { color: var(--ink-faint); }

    .composer-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .btn {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.02em;
      border: 1px solid var(--accent-dim);
      background: transparent;
      color: var(--accent);
      padding: 7px 14px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover:not(:disabled) { background: rgba(201, 154, 91, 0.1); border-color: var(--accent); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .btn-ghost {
      border-color: var(--line);
      color: var(--ink-dim);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--ink-faint); }

    /* ---------- Note list ---------- */
    .note-list { display: flex; flex-direction: column; gap: 10px; }

    .note-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      animation: rise 0.25s ease;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .note-card.leaving {
      animation: fall 0.25s ease forwards;
    }
    @keyframes fall {
      to { opacity: 0; transform: translateY(-4px) scale(0.98); max-height: 0; margin: 0; padding: 0; }
    }

    .note-body { min-width: 0; }
    .note-content {
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }
    .note-trace {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 6px;
      letter-spacing: 0.01em;
    }
    .note-trace .sep { margin: 0 6px; color: var(--line); }

    .note-actions { flex-shrink: 0; }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--ink-dim);
      font-size: 13px;
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    .status-line {
      font-family: var(--mono);
      font-size: 12px;
      min-height: 18px;
      margin-top: 10px;
    }
    .status-line.err { color: var(--danger); }
    .status-line.ok { color: var(--accent); }

    @media (max-width: 640px) {
      .shell { flex-direction: column; }
      .nav { width: 100%; flex-direction: row; overflow-x: auto; padding: 12px; border-right: none; border-bottom: 1px solid var(--line); }
      .nav-brand { display: none; }
      .nav-item { padding: 8px 12px; white-space: nowrap; }
      .workspace { padding: 24px 20px; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <nav class="nav">
      <div class="nav-brand"><strong>Personal</strong> Life OS</div>
      <div class="nav-item active" data-panel="notes">Notes</div>
      <div class="nav-item">Tasks <span class="nav-soon">soon</span></div>
      <div class="nav-item">Projects <span class="nav-soon">soon</span></div>
      <div class="nav-item">Workflows <span class="nav-soon">soon</span></div>
      <div class="nav-item">Review <span class="nav-soon">soon</span></div>
      <div class="nav-item">Search <span class="nav-soon">soon</span></div>
    </nav>

    <main class="workspace">
      <h1>Notes</h1>
      <p class="sub">capture → convert · vertical slice 1</p>

      <div class="composer">
        <textarea id="noteInput" placeholder="What do you need to record?" rows="2"></textarea>
        <div class="composer-row">
          <span class="status-line" id="composerStatus"></span>
          <button class="btn" id="addBtn">Add Note</button>
        </div>
      </div>

      <div id="noteList" class="note-list"></div>
      <div id="emptyState" class="empty-state" style="display:none;">
        Nothing captured yet — whatever's on your mind, write it above.
      </div>
    </main>
  </div>

  <script>
    var noteListEl = document.getElementById('noteList');
    var emptyStateEl = document.getElementById('emptyState');
    var inputEl = document.getElementById('noteInput');
    var addBtn = document.getElementById('addBtn');
    var composerStatus = document.getElementById('composerStatus');

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function relativeTime(iso) {
      if (!iso) return '';
      var diffMs = Date.now() - new Date(iso).getTime();
      var mins = Math.round(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      var hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.round(hrs / 24) + 'd ago';
    }

    function renderNotes(notes) {
      noteListEl.innerHTML = '';
      emptyStateEl.style.display = notes.length ? 'none' : 'block';

      notes.forEach(function (note) {
        var card = document.createElement('div');
        card.className = 'note-card';
        card.dataset.noteId = note.note_id;

        card.innerHTML =
          '<div class="note-body">' +
            '<div class="note-content">' + escapeHtml(note.content) + '</div>' +
            '<div class="note-trace">' +
              escapeHtml(note.creator || 'User') +
              '<span class="sep">·</span>' + escapeHtml(note.created_method || 'Manual') +
              '<span class="sep">·</span>' + relativeTime(note.created_time) +
            '</div>' +
          '</div>' +
          '<div class="note-actions">' +
            '<button class="btn btn-ghost convert-btn">Convert to Task</button>' +
          '</div>';

        card.querySelector('.convert-btn').addEventListener('click', function (ev) {
          convertNote(note.note_id, card, ev.currentTarget);
        });

        noteListEl.appendChild(card);
      });
    }

    function loadNotes() {
      google.script.run
        .withSuccessHandler(function (result) {
          if (!result.ok) {
            composerStatus.textContent = 'Couldn\u2019t load notes — ' + result.message;
            composerStatus.className = 'status-line err';
            return;
          }
          renderNotes(result.notes);
        })
        .withFailureHandler(function (err) {
          composerStatus.textContent = 'Couldn\u2019t load notes — try refreshing.';
          composerStatus.className = 'status-line err';
        })
        .ui_getOpenNotes();
    }

    function addNote() {
      var content = inputEl.value.trim();
      if (!content) {
        composerStatus.textContent = 'Write something first.';
        composerStatus.className = 'status-line err';
        return;
      }
      addBtn.disabled = true;
      composerStatus.textContent = 'Saving\u2026';
      composerStatus.className = 'status-line';

      google.script.run
        .withSuccessHandler(function (result) {
          addBtn.disabled = false;
          if (!result.ok) {
            composerStatus.textContent = 'Couldn\u2019t save — ' + result.message;
            composerStatus.className = 'status-line err';
            return;
          }
          inputEl.value = '';
          composerStatus.textContent = '';
          loadNotes();
        })
        .withFailureHandler(function (err) {
          addBtn.disabled = false;
          composerStatus.textContent = 'Couldn\u2019t save — try again.';
          composerStatus.className = 'status-line err';
        })
        .ui_createNote(content);
    }

    function convertNote(noteId, cardEl, btnEl) {
      btnEl.disabled = true;
      btnEl.textContent = 'Converting\u2026';

      google.script.run
        .withSuccessHandler(function (result) {
          if (!result.ok) {
            btnEl.disabled = false;
            btnEl.textContent = 'Convert to Task';
            composerStatus.textContent = 'Couldn\u2019t convert — ' + result.message;
            composerStatus.className = 'status-line err';
            return;
          }
          cardEl.classList.add('leaving');
          setTimeout(function () {
            cardEl.remove();
            if (!noteListEl.children.length) emptyStateEl.style.display = 'block';
          }, 250);
        })
        .withFailureHandler(function (err) {
          btnEl.disabled = false;
          btnEl.textContent = 'Convert to Task';
          composerStatus.textContent = 'Couldn\u2019t convert — try again.';
          composerStatus.className = 'status-line err';
        })
        .ui_convertNoteToTask(noteId);
    }

    addBtn.addEventListener('click', addNote);
    inputEl.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) addNote();
    });

    loadNotes();
  </script>
</body>
</html>
